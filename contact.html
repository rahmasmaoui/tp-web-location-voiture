
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | AutoLoc</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header class="header">
        <a class="logo" href="index2.html">Auto<span>Loc</span></a>
        <nav>
            <a href="index2.html">Accueil</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="devis.html">Devis</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="section contact-section">
            <div class="section-heading">
                <p class="eyebrow">NOUS SOMMES À VOTRE ÉCOUTE</p>
                <h2>Contactez-nous</h2>
                <p>Remplissez le formulaire et préparez votre demande.</p>
            </div>

            <form id="contactForm" class="form-card">
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" name="name"
                           placeholder="Votre nom complet" required>
                </div>

                <div class="form-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email"
                           placeholder="exemple@email.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Sujet</label>
                    <input type="text" id="subject" name="subject"
                           placeholder="Sujet de votre demande" required>
                </div>

                <div class="form-group">
                    <label for="message">Votre message</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Écrivez votre message ici..." required></textarea>
                </div>

                <button type="submit" class="btn">Envoyer</button>
                <p id="contactResult" class="result" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 AutoLoc — Tous droits réservés.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script2.js"></script>
</body>
</html>
